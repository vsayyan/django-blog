{% extends "base.html" %}

{% block title %}
    {{ post.title }} | My Blog 
{% endblock title %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <p class="meta">by {{ post.author }}</p>
    <p>{{ post.body }}</p>
    <p><a href="{% url 'home' %}">&larr; Back to all posts</a></p>
{% endblock content %}
